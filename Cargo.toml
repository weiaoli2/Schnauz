[package]
name = "schnauz"
version = "0.5.11"
edition = "2021"
description = "A native, project-first Mac file manager with an interactive terminal"
license = "MIT"
repository = "https://github.com/weiaoli2/Schnauz"
publish = false

[features]
ui-checks = ["gpui-terminal/ui-checks"]

[dependencies]
gpui-terminal = { path = "vendor/gpui-terminal" }
portable-pty = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
futures = "0.3"
gpui = "0.2.2"
chrono = "0.4"
# Decode the TIFF that NSImage hands us for file-type icons.
image = { version = "0.25", features = ["tiff"] }
# Fetch real macOS file icons via NSWorkspace (AppKit).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSFileManager", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPDFImageRep", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSView", "NSEvent", "NSApplication", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSSharingService", "NSMenu", "NSMenuItem"] }
# Reach the underlying NSView so we can start native OS drag sessions (drag files out to Finder/other apps).
raw-window-handle = "0.6"

# Local builds default to this Mac; release builds can choose either Mac architecture. The optimized profile is used for normal builds.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
